name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *" # daily at 09:00 KST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-night.svg?palette=github-dark&color_snake=#BFD9FF&color_dots=#161B22,#1E3A7A,#2D5BC4,#3D7BFF,#8FB8FF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
